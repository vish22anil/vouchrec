# Dataset sources and filesystem layout.
#
# Large files live under the data root. Resolution order:
#   1. VOUCHREC_DATA_ROOT environment variable
#   2. VOUCHREC_DATA_ROOT in a repository-level .env file
#   3. paths.data_root below (relative to the repository root)
# Reports contain aggregate statistics only and always live in the repository.

paths:
  data_root: data
  reports_dir: data/reports

amazon_reviews:
  source_dataset: amazon_reviews_2023
  category: Musical_Instruments
  homepage: https://amazon-reviews-2023.github.io/
  hf_repository: https://huggingface.co/datasets/McAuley-Lab/Amazon-Reviews-2023
  hf_revision: 2b6d039ed471f2ba5fd2acb718bf33b0a7e5598e
  citation: >-
    Hou, Y., Li, J., He, Z., Yan, A., Chen, X., McAuley, J. (2024).
    Bridging Language and Items for Retrieval and Recommendation. arXiv:2403.03952.
  license_note: >-
    No data license is declared on the Hugging Face dataset card. The MIT license in
    github.com/hyp1231/AmazonReviews2023 covers code, not review data. Treated as
    research-use data; records are not redistributed.
  official_stats:
    # From https://amazon-reviews-2023.github.io/ (retrieved 2026-10-21); used only for sanity checks.
    raw_users: 1.8M
    raw_items: 213.6K
    raw_ratings: 3.0M
    five_core_users: 57.4K
    five_core_items: 24.6K
    five_core_ratings: 511.8K
  files:
    reviews:
      url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/Musical_Instruments.jsonl.gz
      filename: Musical_Instruments.jsonl.gz
      expected_bytes: 458632324
      # The UCSD server publishes no checksum. Hugging Face LFS publishes the SHA-256 of the
      # same file uncompressed (raw/review_categories/Musical_Instruments.jsonl @ hf_revision).
      expected_uncompressed_bytes: 1557845107
      expected_uncompressed_sha256: 63aee24d5b9eaf0069cf638703e2d62eb80fde5d2c00ca3d29881d645f6214b3
    meta:
      url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Musical_Instruments.jsonl.gz
      filename: meta_Musical_Instruments.jsonl.gz
      expected_bytes: 155378934
      expected_uncompressed_bytes: 631877970
      expected_uncompressed_sha256: 96f40b5440918f07e3e08e84b7a6874a06a5e32a9988998ca9520cfd1b51a12c

external_fake_reviews:
  flowerly_modern_fake_reviews_lfm:
    download_allowed: true
    use_status: candidate  # downloaded for audit; not approved as experimental ground truth
    hf_repository: https://huggingface.co/datasets/Flowerly/modern-fake-reviews-lfm
    hf_revision: d8580b0f9c1f60abfd7bf897417da24c2a739b8c
    license: CC-BY-4.0
    label_meaning: >-
      OR = human-written review taken from the Salminen et al. Kaggle "Fake Reviews" dataset
      (authenticity assumed by the authors, not verified); CG = generated by LFM2.5-1.2B.
      The label means machine-generated, not deceptive intent.
    files:
      - split: train
        filename: train-00000-of-00001.parquet
        url: https://huggingface.co/datasets/Flowerly/modern-fake-reviews-lfm/resolve/d8580b0f9c1f60abfd7bf897417da24c2a739b8c/data/train-00000-of-00001.parquet
        expected_bytes: 6545129
        expected_sha256: cb0c9970a1445385e64c033ca2607ccc4b31c1e68abc2317f891be7896b494cd
      - split: validation
        filename: validation-00000-of-00001.parquet
        url: https://huggingface.co/datasets/Flowerly/modern-fake-reviews-lfm/resolve/d8580b0f9c1f60abfd7bf897417da24c2a739b8c/data/validation-00000-of-00001.parquet
        expected_bytes: 468398
        expected_sha256: e7182826eecb92857e8776c13a018f48e107faf6c474364fea99ed5ea86841e6
      - split: test
        filename: test-00000-of-00001.parquet
        url: https://huggingface.co/datasets/Flowerly/modern-fake-reviews-lfm/resolve/d8580b0f9c1f60abfd7bf897417da24c2a739b8c/data/test-00000-of-00001.parquet
        expected_bytes: 1137130
        expected_sha256: 8ad30a1e651bb1ba6f662ca33a8ad1caac53f01d88e024bf17230c98756af914

  detectairev:
    download_allowed: false
    use_status: rejected_pending_license
    hf_repository: https://huggingface.co/datasets/Sifi-world/DetectAIRev
    hf_revision: d887bce92d2118190d08f5375a7f93f5d94ac19d
    license: null
    reason: >-
      No license declared; one-sentence dataset card; no provenance for the human-written
      half or generation settings; domains are hotels/movies rather than products.
    files:
      - split: full
        filename: Testing_generated_review.csv
        url: https://huggingface.co/datasets/Sifi-world/DetectAIRev/resolve/d887bce92d2118190d08f5375a7f93f5d94ac19d/Testing_generated_review.csv
        expected_bytes: 71353419
